# Automatically build every supported Minecraft version for every push
# and submitted pull request. This can help catch issues that only occur
# on certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: setup jdk 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 25
      - name: setup gradle
        uses: gradle/actions/setup-gradle@v4
      - name: build
        run: ./gradlew buildAll
      - name: capture build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mod-jars
          path: versions/*/build/libs/
          if-no-files-found: error
